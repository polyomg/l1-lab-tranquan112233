<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gửi Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h3>Gửi Email</h3>
<form th:action="@{/mail/form/send}" method="post">
    <div class="mb-3"><label>From:</label><input type="text" name="from" class="form-control"></div>
    <div class="mb-3"><label>To:</label><input type="text" name="to" class="form-control"></div>
    <div class="mb-3"><label>CC:</label><input type="text" name="cc" class="form-control"></div>
    <div class="mb-3"><label>BCC:</label><input type="text" name="bcc" class="form-control"></div>
    <div class="mb-3"><label>Subject:</label><input type="text" name="subject" class="form-control"></div>
    <div class="mb-3"><label>Body:</label><textarea name="body" class="form-control"></textarea></div>
    <div class="mb-3"><label>Attachments:</label><input type="text" name="filenames" class="form-control" placeholder="C:\file1.pdf, C:\file2.jpg"></div>
    <button type="submit" class="btn btn-primary">Gửi trực tiếp</button>
    <button type="submit" formaction="/mail/form/push" class="btn btn-success">Xếp vào hàng đợi</button>
</form>
</body>
</html>
